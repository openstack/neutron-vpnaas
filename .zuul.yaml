- project:
    templates:
      - check-requirements
      - openstack-cover-jobs-neutron
      - openstack-python3-jobs-neutron
      - periodic-stable-jobs-neutron
      - publish-openstack-docs-pti
      - release-notes-jobs-python3
    check:
      jobs:
        - openstack-tox-py311:
            required-projects:
              - openstack/neutron
        - openstack-tox-py314:
            required-projects:
              - openstack/neutron
        - openstack-tox-docs:
            required-projects:
              - openstack/neutron
        - neutron-vpnaas-functional-sswan
        - neutron-vpnaas-functional-lswan
        - neutron-tempest-plugin-vpnaas
        - neutron-tempest-plugin-vpnaas-ovn
        - neutron-tempest-plugin-vpnaas-ovn-sswan-legacy
        - neutron-tempest-plugin-vpnaas-ovn-lswan
    gate:
      jobs:
        - openstack-tox-py311:
            required-projects:
              - openstack/neutron
        - openstack-tox-py314:
            required-projects:
              - openstack/neutron
        - openstack-tox-docs:
            required-projects:
              - openstack/neutron
        - neutron-vpnaas-functional-sswan
        - neutron-tempest-plugin-vpnaas
        - neutron-tempest-plugin-vpnaas-ovn
    periodic-weekly:
      jobs: &vpnaas-periodic-weekly-jobs
        - openstack-tox-py314:
            required-projects:
              - openstack/neutron
        - openstack-tox-py314-with-oslo-master:
            required-projects:
              - openstack/neutron
        - neutron-tempest-plugin-vpnaas
        - neutron-tempest-plugin-vpnaas-ovn
        - neutron-tempest-plugin-vpnaas-ovn-sswan-legacy
        - neutron-tempest-plugin-vpnaas-ovn-lswan
        - neutron-vpnaas-functional-sswan
        - neutron-vpnaas-functional-lswan
        - neutron-vpnaas-rally-ovs
    experimental:
      jobs: *vpnaas-periodic-weekly-jobs

- job:
    name: neutron-tempest-plugin-vpnaas-ovn-lswan
    parent: neutron-tempest-plugin-vpnaas-ovn
    vars:
      devstack_localrc:
        IPSEC_PACKAGE: libreswan

- job:
    name: neutron-tempest-plugin-vpnaas-ovn-sswan-legacy
    parent: neutron-tempest-plugin-vpnaas-ovn
    vars:
      devstack_localrc:
        STRONGSWAN_USE_SWANCTL: False

- job:
    name: neutron-vpnaas-functional-sswan
    parent: neutron-functional
    pre-run: playbooks/configure_functional_job.yaml
    vars:
      project_name: neutron-vpnaas
      tox_envlist: dsvm-functional-sswan

- job:
    name: neutron-vpnaas-functional-lswan
    parent: neutron-functional
    pre-run: playbooks/configure_functional_job.yaml
    vars:
      project_name: neutron-vpnaas
      tox_envlist: dsvm-functional-lswan

- job:
    name: neutron-vpnaas-rally-ovs
    parent: rally-task-neutron
    timeout: 7800
    pre-run: playbooks/configure_rally_job.yaml
    vars:
      devstack_localrc:
        Q_AGENT: openvswitch
        Q_ML2_PLUGIN_MECHANISM_DRIVERS: openvswitch
        Q_ML2_TENANT_NETWORK_TYPE: vxlan
      devstack_services:
        # Cinder services
        c-api: false
        c-bak: false
        c-sch: false
        c-vol: false
        cinder: false
        # Swift services
        s-account: false
        s-container: false
        s-object: false
        s-proxy: false
        # Disable OVN services (DevStack defaults to OVN)
        ovn-controller: false
        ovn-northd: false
        ovs-vswitchd: false
        ovsdb-server: false
        q-ovn-agent: false
        # Enable OVS agent and L3/DHCP/metadata agents
        q-agt: true
        q-l3: true
        q-dhcp: true
        q-meta: true
        q-metering: true
        q-svc: true
      devstack_plugins:
        rally-openstack: https://opendev.org/openstack/rally-openstack
        neutron-vpnaas: https://opendev.org/openstack/neutron-vpnaas
      rally_task: rally-jobs/rally-configs/rally_config_non_dvr.yaml
    required-projects:
      - openstack/neutron
      - openstack/neutron-vpnaas
      - openstack/rally
      - openstack/rally-openstack
    irrelevant-files:
      - ^.*\.rst$
      - ^doc/.*$
      - ^neutron_vpnaas/tests/unit/.*$
      - ^releasenotes/.*$
